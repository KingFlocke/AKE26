# .github/workflows/ci.yml - laeuft bei jedem Push auf einem Rechner von GitHub
name: ci
on: [push]
env: {MODEL_URI: lab07/model}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r lab07/requirements-ci.txt
      - run: python -m pytest lab07 -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t traeger-service -f lab07/Dockerfile .
      - run: docker run -d -p 8000:8000 traeger-service
      - run: curl --fail --retry 10 --retry-all-errors
               --retry-delay 2 http://localhost:8000/health
