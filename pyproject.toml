[project]
name = "ake-labs"
version = "2026.1"
description = "Laborumgebung für Angewandte KI & KI-Engineering (AKE), WS 2026/27"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Notebook-Oberfläche (bewusst Jupyter Notebook, keine KI-Erweiterungen)
    "notebook>=7.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    # Deep Learning (CPU-Build, siehe [tool.uv.sources])
    "torch>=2.5,<2.9",
    "torchvision>=0.20,<0.24",
    # Grundlagen Daten & Plots
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "psutil>=6.0",
    # Sequenzmodelle, Transformer, LLM-Anpassung
    "transformers>=4.46,<5",
    "datasets>=3.0",
    "peft>=0.13",
    "accelerate>=1.0",
    "sentence-transformers>=3.2",
    "umap-learn>=0.5.6",
    # Zeitreihen
    "lightgbm>=4.5",
    "statsforecast>=1.7",
    # Daten-Engineering & MLOps
    "dvc>=3.55",
    "mlflow>=2.17,<3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "evidently>=0.4.40,<0.5",
    # XAI
    "shap>=0.46",
    "grad-cam>=1.5.4",
]

[tool.uv]
# Kein installierbares Paket, nur eine Umgebung für die Notebooks
package = false
# Unterstützte Plattformen. Intel-Macs fehlen bewusst: PyTorch liefert seit
# Version 2.3 keine Wheels mehr für macOS x86_64 -> dort Colab-Notlösung.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# PyTorch als CPU-Build (~200 MB statt ~2,5 GB mit CUDA) unter Windows/Linux.
# macOS nutzt den regulären PyPI-Build (CPU + MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
